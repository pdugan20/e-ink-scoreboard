version: 2
updates:
  # Renovate owns routine npm and GitHub Actions updates; Dependabot keeps
  # pip proposals (human-merged) and repository security updates.
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'python'
    assignees:
      - 'pdugan20'
    reviewers:
      - 'pdugan20'
    groups:
      python-dependencies:
        update-types:
          - 'minor'
          - 'patch'
